<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문장 목록 및 진행상태 관리 유틸</title>
<link rel="stylesheet" href="aiSubSearch.css">
<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
<script src="common.js"></script>

</head>

<body>

<h1 class="page-title">문장 목록 / 진행상태 관리 유틸 (활용 : AI 보조 검색어 목록관리)</h1>

<!-- 상단 입력 -->
<section class="top-panel">
    <div class="top-toolbar">
        <strong>문장 입력</strong>

        <div class="top-actions">
            <button type="button" id="cleanButton">문장 정리</button>
            <button type="button" class="primary" id="registerButton">
                목록 등록
            </button>
        </div>
    </div>

    <textarea
        id="sourceText"
        placeholder="여러 줄의 문장을 입력하세요.&#10;각 줄을 하나의 목록 항목으로 등록합니다."
    >  aaa 
 bb  b   
 
 ccccc
 
    </textarea>
</section>

<!-- 하단 좌우 영역 -->
<div class="bottom-layout">

    <!-- 좌측 목록 -->
    <section class="panel list-panel">
        <div class="panel-title">
            <span>목록</span>
            <span class="count" id="itemCount">0개</span>
        </div>

        <select
            id="itemList"
            size="15"
            aria-label="등록된 문장 목록"
        ></select>

        <div class="list-toolbar">
            <button type="button" id="sortButton">문자열 정렬</button>
            <button type="button" id="deleteButton">선택 삭제</button>
        </div>

        <div class="list-help">
            <div>회색: 대기</div>
            <div>파란색: 진행중</div>
            <div>녹색: 완료</div>
            <div>옅은 붉은색: 강제종료</div>
            <div style="margin-top:6px;">
                항목을 선택하면 우측 상세 정보가 표시됩니다.
				<br />유의사항 : 브라우저를 닫으면, 모든 내용이 초기화 삭제 됩니다. (페이지 유지동안에만 정보 유지 유의)
            </div>
        </div>
    </section>

    <!-- 우측 상세 정보 -->
    <section class="panel detail-panel">
        <div class="panel-title">
            <span>상세 정보</span>
            <span class="count" id="selectedInfo">선택 항목 없음</span>
        </div>

        <div class="form-row">
            <label for="title">제목</label>
            <input
                type="text"
                id="title"
                placeholder="목록에서 항목을 선택하세요."
            >
        </div>

        <div class="form-row">
            <label for="status">진행 상태</label>

            <div class="status-row">
                <span
                    id="statusIndicator"
                    class="status-indicator status-wait"
                ></span>

                <select id="status">
                    <option value="wait">대기</option>
                    <option value="progress">진행중</option>
                    <option value="complete">완료</option>
                    <option value="stop">강제종료</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label>정보 내용</label>

            <div class="detail-content">
                <div class="detail-content-header">선택 항목 내용</div>
                <div id="detailContent" tabindex="0">
                    목록에서 항목을 선택하세요.
                </div>
            </div>
        </div>

        <div class="form-row">
            <label for="memo">메모</label>
            <textarea
                id="memo"
                placeholder="진행 내용, 작업 결과, 참고사항 등을 입력하세요."
            ></textarea>
        </div>

        <div class="detail-footer">
            <span class="message" id="saveMessage">
                저장 전
            </span>

            <div class="footer-buttons">
                <button type="button" id="resetButton">입력 취소</button>
                <button type="button" class="primary" id="saveButton">
                    정보 저장
                </button>
            </div>
        </div>
    </section>
</div>

<script src="aiSubSearch.js"></script>

</body>
</html>
